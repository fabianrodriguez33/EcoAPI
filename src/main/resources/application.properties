spring.application.name=EcoAPI
server.port=8080

# Base relacional H2 en memoria: el esquema y los datos semilla se cargan en cada arranque
spring.datasource.url=jdbc:h2:mem:ecodb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Token JWT firmado (HS256) con vigencia de una hora
eco.jwt.secreto=${ECO_JWT_SECRETO:ecoRecicla-secreto-jwt-unidad2-2026-clave-de-al-menos-256-bits}
eco.jwt.vigencia-segundos=3600
